# Конфигурация ruff под «Перечень нарушений оформления git-репозитория».

# П2: код на Python не должен содержать строки длиннее 80 символов.
line-length = 79
target-version = "py311"

[lint]
select = [
    "E",      # pycodestyle: ошибки (в т.ч. E501 — длина строки, правило П2)
    "W",      # pycodestyle: предупреждения
    "F",      # pyflakes: неиспользуемые имена и импорты
    "I",      # порядок импортов
    "N",      # И1: имена по PEP8
    "D",      # К1: docstring вместо комментариев
    "C90",    # Ц1: цикломатическая сложность
    "PLR",    # А1 (число аргументов), М1 (магические числа)
]

ignore = [
    "D203",   # конфликтует с D211, оставляем D211
    "D213",   # конфликтует с D212, оставляем D212
]

[lint.mccabe]
# Ц1: цикломатическая сложность не выше 10.
max-complexity = 10

[lint.pylint]
# А1: не более 7 аргументов у функции.
max-args = 7

[lint.pydocstyle]
convention = "pep257"

[lint.per-file-ignores]
# В тестах допустимы «магические» числа в проверках.
"tests/*" = ["PLR2004"]
